/**:
  ros__parameters:

    version: 1.1.1

    adaptive: true

    pointcloud/deskew: true
    pointcloud/voxelize: true

    imu/calibration: true
    imu/intrinsics/accel/bias: [ 0.0, 0.0, 0.0 ]
    imu/intrinsics/accel/sm:   [ 1.,  0.,  0.,
                                 0.,  1.,  0.,
                                 0.,  0.,  1. ]
    imu/intrinsics/gyro/bias: [ 0.0, 0.0, 0.0 ]

    # 命名有歧义，实际上是从imu/lidar坐标到baselink坐标的变换
    extrinsics/baselink2imu/t: [0.00425, 0.00418, -0.00446]
    extrinsics/baselink2lidar/t: [ 0.,  0.,  0. ]
    # 原始外参，激光雷达平放, 点云未变换：
    # extrinsics/baselink2imu/R: [ 0.,  -1.,  0.,
    #                              -1.,  0.,  0.,
    #                              0.,  0.,  -1. ]
    # extrinsics/baselink2lidar/R: [ 1.,  0.,  0.,
    #                                0.,  1.,  0.,
    #                                0.,  0.,  1. ]

    # 激光雷达垂直, 点云未变换：
    extrinsics/baselink2imu/R: [ 0.,  0.,  -1.,
                                 1.,  0.,  0.,
                                 0.,  -1.,  0. ]
    extrinsics/baselink2lidar/R: [ 0.,  0.,  1.,
                                   0.,  -1.,  0.,
                                   1.,  0.,  0. ]

    # 激光雷达垂直, airy sdk setting: roll: 0, pitch: -pi/2, yaw: pi
    # extrinsics/baselink2imu/R: [ 0.,  0.,  -1.,
    #                              1.,  0.,  0.,
    #                              0.,  -1.,  0. ]
    # extrinsics/baselink2lidar/R: [ 1.,  0.,  0.,
    #                                0.,  1.,  0.,
    #                                0.,  0.,  1. ]
